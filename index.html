<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>恋爱清单30件</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://at.alicdn.com/t/font_2121551_vt9vvdg9vvp.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; font-family: "Noto Sans SC", sans-serif; color: #333; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; padding: 50px 20px; }
        .header { text-align: center; margin-bottom: 50px; }
        .avatars { display: flex; justify-content: center; align-items: center; margin-bottom: 24px; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff; object-fit: cover; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .avatar:first-child { margin-right: -6px; }
        .avatar:last-child { margin-left: -6px; }
        .mid-heart { width: 20px; height: 20px; z-index: 2; flex-shrink: 0; animation: heartbeat 1.2s ease-in-out infinite; }
        .mid-heart svg { width: 100%; height: 100%; fill: #ff5a8a; }
        @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
        /* 相恋俩字：手写情书字体，豆沙红色 */
        .love-text {
            font-family: "Ma Shan Zheng", cursive;
            font-size: 32px;
            color: #b74258;
            letter-spacing: 10px;
            text-indent: 10px;
            margin-bottom: 10px;
        }
        .timer-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
        .love-time { font-size: 18px; color: #b74258; font-weight: 600; letter-spacing: 1px; }
        #pause { background: none; border: none; padding: 0; width: 20px; height: 20px; cursor: pointer; outline: none; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; position: relative; }
        #pause.rotate i { animation: rotate 3s linear infinite; }
        #pause::after { content: ""; position: absolute; width: 14px; height: 1px; background: #666; transform: rotate(-45deg); }
        #pause.rotate::after { display: none; }
        @keyframes rotate { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        .info-btn { color: #999; font-size: 16px; cursor: pointer; }
        .subtitle { font-size: 14px; color: #888; line-height: 1.8; max-width: 400px; margin: 0 auto; }
        .subtitle .highlight { color: #b74258; }
        .list { border-top: 1px solid #f0f0f0; }
        .list-item { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; gap: 12px; }
        .checkbox { width: 18px; height: 18px; border: 2px solid #ddd; flex-shrink: 0; background: #fff; }
        .list-item.done .checkbox { background: #b74258; border-color: #b74258; position: relative; }
        .list-item.done .checkbox::after { content: "✓"; color: #fff; font-size: 12px; position: absolute; top: -2px; left: 2px; }
        .item-text { flex: 1; font-size: 15px; color: #333; }
        .list-item.done .item-text { color: #b74258; font-weight: 500; }
        .item-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .item-thumb.grayscale { filter: grayscale(100%); opacity: .6; }
        .item-num { font-size: 36px; font-weight: 200; color: #f0f0f0; line-height: 1; font-family: Georgia, serif; font-style: italic; min-width: 30px; text-align: right; transition: all .3s; }
        .item-num.active { color: #b74258; font-weight: 600; font-style: normal; transform: scale(1.1); }
        .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
        .modal-mask.show { display: flex; }
        .modal-card { width: 100%; max-width: 360px; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.15); animation: popIn .25s ease-out; }
        @keyframes popIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
        .modal-tag { font-size: 14px; color: #666; padding: 20px 20px 4px; }
        .modal-title { font-size: 30px; font-weight: 700; color: #111; padding: 0 20px 16px; }
        .modal-img { width: 100%; height: 220px; object-fit: cover; }
        .modal-img.grayscale { filter: grayscale(100%); opacity: .7; }
        .modal-desc { font-size: 15px; color: #555; padding: 20px; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="avatars">
            <img class="avatar" id="avatar1" src="" alt="">
            <div class="mid-heart"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
            <img class="avatar" id="avatar2" src="" alt="">
        </div>
        <div class="love-text">相恋</div>
        <div class="timer-row">
            <div class="love-time" id="loveTime">0天00时00分00秒</div>
            <button id="pause"><i class="iconfont icon-music"></i></button>
            <div class="info-btn" onclick="openInfo()">ⓘ</div>
        </div>
        <div class="subtitle">我们的恋爱清单，30件充满爱的事记录我们的相恋历程，相信我们还会留下更多美好的回忆。<span class="highlight">📝祝福我们</span></div>
    </div>
    <div class="list" id="list"></div>
</div>

<audio id="bgMusic" loop preload="auto"></audio>

<div class="modal-mask" id="modalMask"><div class="modal-card">
    <div class="modal-tag" id="modalTag"></div><div class="modal-title" id="modalTitle"></div>
    <img class="modal-img" id="modalImg" src="" alt=""><div class="modal-desc" id="modalDesc">事件完成的时间、地点以及心情描述。</div>
</div></div>

<div class="modal-mask" id="infoMask"><div class="modal-card">
    <div class="modal-title" style="padding-top:20px">关于我们</div>
    <div class="modal-desc" style="padding-top:4px">这里写你们的小故事：怎么认识的、第一次约会在哪里、现在一起生活多久了。<br><br>这个小站是我们一起完成100件恋爱小事的清单，每完成一件就打个勾，攒满就是我们的一辈子。</div>
</div></div>

<script>
// ========== 可配置区域 ==========
const qq1 = "240233869";
const qq2 = "3118300699";
const beginDate = "2026-09-25 00:00:00";
const musicUrl = "https://cdn.pixabay.com/download/audio/2021/11/25/audio_91b5a0e0d8.mp3?filename=cute romantic comedy ukulele.mp3";

const listData = [
    {done:"n", text:"一起看日出", img:"https://picsum.photos/seed/sunrise/400/200"},
    {done:"n", text:"一起看日落", img:"https://picsum.photos/seed/sunset/400/200"},
    {done:"n", text:"一起滑雪", img:"https://picsum.photos/seed/ski/400/200"},
    {done:"n", text:"一起堆雪人", img:"https://picsum.photos/seed/snowman/400/200"},
    {done:"n", text:"一起看海", img:"https://picsum.photos/seed/sea/400/200"},
    {done:"n", text:"一起数星星", img:"https://picsum.photos/seed/star/400/200"},
    {done:"n", text:"一起去鬼屋", img:"https://picsum.photos/seed/ghost/400/200"},
    {done:"n", text:"一起坐摩天轮", img:"https://picsum.photos/seed/wheel/400/200"},
    {done:"n", text:"一起搬东西", img:"https://picsum.photos/seed/move/400/200"},
    {done:"n", text:"一起布置我们的小窝", img:"https://picsum.photos/seed/home/400/200"},
    {done:"n", text:"一起刷牙", img:"https://picsum.photos/seed/brush/400/200"},
    {done:"n", text:"一起洗衣服", img:"https://picsum.photos/seed/wash/400/200"},
    {done:"n", text:"一起看球赛", img:"https://picsum.photos/seed/ball/400/200"},
    {done:"n", text:"一起看恐怖片", img:"https://picsum.photos/seed/horror/400/200"},
    {done:"n", text:"一起熬夜玩游戏", img:"https://picsum.photos/seed/game/400/200"},
    {done:"n", text:"一起做蛋糕", img:"https://picsum.photos/seed/cake/400/200"},
    {done:"n", text:"一起游泳", img:"https://picsum.photos/seed/swim/400/200"},
    {done:"n", text:"一起看烟花", img:"https://picsum.photos/seed/firework/400/200"},
    {done:"n", text:"一起对着流星许愿", img:"https://picsum.photos/seed/meteor/400/200"},
    {done:"n", text:"一起骑自行车", img:"https://picsum.photos/seed/bike/400/200"},
    {done:"n", text:"一起吃棉花糖", img:"https://picsum.photos/seed/candy/400/200"},
    {done:"n", text:"一起去K歌", img:"https://picsum.photos/seed/k歌/400/200"},
    {done:"n", text:"一起淋雨", img:"https://picsum.photos/seed/rain/400/200"},
    {done:"n", text:"一起打水仗", img:"https://picsum.photos/seed/water/400/200"},
    {done:"n", text:"一起骑脚踏车", img:"https://picsum.photos/seed/ride/400/200"},
    {done:"n", text:"一起爬山", img:"https://picsum.photos/seed/climb/400/200"},
    {done:"n", text:"一起露营", img:"https://picsum.photos/seed/camp/400/200"},
    {done:"n", text:"一起晨练", img:"https://picsum.photos/seed/morning/400/200"},
    {done:"n", text:"一起傻笑", img:"https://picsum.photos/seed/laugh/400/200"},
    {done:"y", text:"一起看樱花", img:"https://picsum.photos/seed/cherry/400/200"}
];

document.getElementById('avatar1').src = `https://q1.qlogo.cn/g?b=qq&nk=${qq1}&s=100`;
document.getElementById('avatar2').src = `https://q1.qlogo.cn/g?b=qq&nk=${qq2}&s=100`;

function updateLoveTime() {
    const begin = new Date(beginDate.replace(/-/g, '/'));
    const now = new Date();
    let diff = Math.floor((now - begin) / 1000);
    const d = Math.floor(diff / 86400); diff %= 86400;
    const h = Math.floor(diff / 3600); diff %= 3600;
    const m = Math.floor(diff / 60); const s = diff % 60;
    document.getElementById('loveTime').innerText = `${d}天${String(h).padStart(2,'0')}时${String(m).padStart(2,'0')}分${String(s).padStart(2,'0')}秒`;
}
updateLoveTime(); setInterval(updateLoveTime, 1000);

const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('pause');
let musicPlaying = false;
bgMusic.src = musicUrl; bgMusic.load();
function toggleMusic() {
    musicPlaying ? (bgMusic.pause(), musicBtn.classList.remove('rotate')) : (bgMusic.play(), musicBtn.classList.add('rotate'));
    musicPlaying = !musicPlaying;
}
musicBtn.onclick = toggleMusic;
bgMusic.onerror = () => { bgMusic.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"; bgMusic.load(); };
window.addEventListener('load', () => bgMusic.play().then(() => { musicBtn.classList.add('rotate'); musicPlaying = true; }).catch(()=>{}));
document.body.addEventListener('click', () => { if(!musicPlaying) toggleMusic(); }, {once:true});

const listEl = document.getElementById('list');
listData.forEach((item, i) => {
    const num = i + 1, isDone = item.done === "y";
    const div = document.createElement('div');
    div.className = 'list-item' + (isDone ? ' done' : '');
    div.innerHTML = `<div class="checkbox"></div><div class="item-text">${item.text}</div><img class="${isDone?'item-thumb':'item-thumb grayscale'}" src="${item.img}" alt=""><div class="item-num">${num}</div>`;
    div.onclick = () => {
        document.querySelectorAll('.item-num').forEach(el => el.classList.remove('active'));
        div.querySelector('.item-num').classList.add('active');
        document.getElementById('modalTag').innerText = `第${num}件事${isDone ? '已完成' : '进行中'}`;
        document.getElementById('modalTitle').innerText = item.text;
        const modalImg = document.getElementById('modalImg');
        modalImg.src = item.img; modalImg.classList.toggle('grayscale', !isDone);
        document.getElementById('modalMask').classList.add('show');
    };
    listEl.appendChild(div);
});

document.getElementById('modalMask').onclick = (e) => { if(e.target === e.currentTarget) e.currentTarget.classList.remove('show'); };
document.getElementById('infoMask').onclick = (e) => { if(e.target === e.currentTarget) e.currentTarget.classList.remove('show'); };
function openInfo() { document.getElementById('infoMask').classList.add('show'); }
</script>
</body>
</html>
